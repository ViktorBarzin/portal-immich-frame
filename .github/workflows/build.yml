# Build, sign and publish a frame release.
#
# Off-infra by doctrine (infra ADR-0002): the homelab runs no build pipeline.
# Public repo, so GitHub Actions minutes are free.
#
# Publishing a release is what makes the frames update themselves: they poll
# `latest.json` from the newest release and install the APK it names
# (docs/adr/0006-in-app-ota-updates.md). Both assets are produced here so they
# can never disagree — a manifest naming a checksum the APK does not have is a
# silently skipped update on every frame.
#
# Note on injection safety: nothing here interpolates event-supplied text into a
# shell. The `run:` steps read GITHUB_* environment variables, and the only
# `${{ }}` expressions sit in `with:`/`env:` blocks.
name: build

on:
  push:
    tags: ['v*']
  # Lets a build be exercised without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore the signing key
        # The SAME key the frames already have installed — Android refuses an
        # update signed by anything else, so this is not interchangeable with a
        # freshly generated debug keystore. Held in Vault; mirrored here as a
        # repo secret because Actions cannot reach the homelab.
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 is not set — the build would be signed with a throwaway key and every frame would reject the update."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/signing/frame.keystore"
          # Record what correctly-signed output must look like, so the check after
          # the build compares against the key we were GIVEN rather than whatever
          # the build happened to use.
          keytool -exportcert -keystore "${RUNNER_TEMP}/signing/frame.keystore" \
            -alias androiddebugkey -storepass android \
            | sha256sum | cut -d' ' -f1 > "${RUNNER_TEMP}/signing/expected-cert.sha256"
          echo "expected signer: $(cat "${RUNNER_TEMP}/signing/expected-cert.sha256")"

      - name: Test and build
        # The manifest URL is baked in: 'releases/latest/download/...' is a stable
        # redirect to the newest release, so a build published today keeps finding
        # its successors without another rebuild.
        #
        # -PdebugKeystore is explicit on purpose: the implicit ~/.android location
        # is not the same here as it is locally, and relying on it produced a
        # release signed with a throwaway key that no frame would have accepted.
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleDebug \
            -PdebugKeystore="${RUNNER_TEMP}/signing/frame.keystore" \
            -PupdateUrl="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"

      - name: Verify the APK is signed with the frames' key
        # The failure this guards against is silent and total: a correctly built,
        # correctly published release that every Portal refuses to install. Cheap
        # to check, so check it every time rather than trusting the build.
        run: |
          set -euo pipefail
          apksigner=$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep -m1 -oE '[0-9a-f]{64}')
          expected=$(cat "${RUNNER_TEMP}/signing/expected-cert.sha256")
          echo "expected: $expected"
          echo "actual:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK is signed with the wrong key — installed frames would reject this update."
            exit 1
          fi

      - name: Assemble the release artifacts
        id: artifacts
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          version_name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          version_code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          # The tag is the source of truth for what is being published; a mismatch
          # means the version bump was forgotten, and the frames would either skip
          # the release or take it under the wrong name.
          tag="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$tag" != "$version_name" ]; then
            echo "::error::tag does not match versionName in app/build.gradle.kts"
            exit 1
          fi
          out="frame-v${version_name}.apk"
          cp "$apk" "$out"
          sha=$(sha256sum "$out" | cut -d' ' -f1)
          cat > latest.json <<JSON
          {
            "versionCode": ${version_code},
            "versionName": "${version_name}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version_name}/${out}",
            "sha256": "${sha}"
          }
          JSON
          cat latest.json
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: frame-apk
          path: |
            ${{ steps.artifacts.outputs.apk }}
            latest.json

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.apk }}
            latest.json
